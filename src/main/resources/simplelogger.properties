# SLF4J simple logger (used by DJL). Show only warnings and errors so the console stays readable,
# while real problems (for example a failed native-library download) are still printed.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
