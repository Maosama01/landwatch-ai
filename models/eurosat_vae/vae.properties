# LandWatch AI - EuroSAT variational autoencoder (trained with DJL)
architecture=convolutional VAE (Kingma & Welling 2014)\: encoder 4 x [4x4 conv stride 2 + ReLU] (32-64-128-256), Linear -> mu, logvar; decoder Linear + 4 x [2x nearest upsample, 3x3 conv + ReLU] (128-64-32-32), 3x3 conv -> logits
checkpoint.selection=epoch with the lowest VAL negative ELBO (z \= mu)
data.test_images=4050
data.train_images=18900
data.val_images=4050
djl_version=0.40.0
engine_version=2.7.1
input=64x64 RGB, pixel values / 255 (no normalisation), sigmoid output
latent=64
loss=negative ELBO\: Bernoulli reconstruction (BCE summed over pixels) + 1.0 x KL to N(0, I)
metrics.val.kl=26.7120
metrics.val.mse=0.004305
metrics.val.negative_elbo=7624.2738
metrics.val.psnr_db=23.66
metrics.val.reconstruction=7597.5617
trainable_parameters=1878211
training.augmentation=TRAIN only\: random D4 transform (rotation by 0/90/180/270 deg, optional horizontal flip)
training.batch_size=64
training.best_epoch=24
training.beta=1.0
training.device=mps(0)
training.epochs_completed=25
training.epochs_planned=25
training.lr_schedule=cosine decay from 0.001 to 1.0000001E-5
training.optimizer=Adam
training.seed=42
training.time_seconds=868
